# Publishes the public site to GitHub Pages.
#
# No database is involved: the build reads data/content.json, which is
# committed to the repo. Export a fresh one from the portal any time with
#   npm run content:export
# and commit it.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The site then appears at
#   https://<owner>.github.io/<repo>/
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'data/content.json'
      - 'views/**'
      - 'public/**'
      - 'server/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The static build needs only ejs. Skipping the native and image
      # dependencies keeps this fast and avoids compiling anything.
      - name: Install build dependencies
        run: npm install --no-save ejs@3.1.10

      - name: Build
        # A project page is served from /<repo>, so the base path must match.
        run: node server/export-static.js --base "/${GITHUB_REPOSITORY#*/}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
