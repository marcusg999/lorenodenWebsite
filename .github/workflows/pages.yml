# Publishes the public site to GitHub Pages.
#
# No database is involved: the build reads data/content.json, which is
# committed to the repo. Export a fresh one from the portal any time with
#   npm run content:export
# and commit it.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". The site then appears at
#   https://<owner>.github.io/<repo>/
name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
      # Preview branches publish too, so the site can be reviewed before it is
      # merged. Once this is on main, narrow this list to main alone.
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The static build needs only ejs. Skipping the native and image
      # dependencies keeps this fast and avoids compiling anything.
      - name: Install build dependencies
        run: npm install --no-save ejs@3.1.10

      - name: Build
        # A project page is served from /<repo>, so the base path must match.
        run: node server/export-static.js --base "/${GITHUB_REPOSITORY#*/}"

      # A plain artifact as well, so the built site can be downloaded and
      # opened locally even before Pages is switched on for the repository.
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Without this, a repository that has not enabled Pages fails here with
      # an opaque "Get Pages site failed". Say what to do instead.
      - name: Check that Pages is enabled
        run: |
          if [ -z "${{ secrets.GITHUB_TOKEN }}" ]; then exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "::error::Enable it once at Settings → Pages → Build and deployment → Source: \"GitHub Actions\", then re-run this workflow."
            echo "::notice::The built site is still attached to this run as the \"site\" artifact — download it to preview locally."
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
