# Render Blueprint for the admin portal.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Render reads this file and creates the service, the disk and the variables
# below. Anything marked sync:false it will ask you for.
#
# The portal is the Node app; the public site is built separately and served
# as static files (see netlify.toml). They can live on different hosts and
# different domains — the portal commits content to the repo, and the site
# rebuilds from it.
#
# The disk is the part that matters. SQLite and uploaded images live on it.
# Without it they sit on the container's ephemeral filesystem and every
# deploy wipes them. Render's free instance type does not support disks, so
# this asks for the smallest paid one.

services:
  - type: web
    name: loren-oden-portal
    runtime: node
    plan: starter          # free instances cannot mount a disk
    region: oregon         # move this nearer your audience if you prefer
    branch: main
    buildCommand: npm ci
    # seed only fills collections that are empty, so this is safe on restart.
    startCommand: npm run seed && npm start
    healthCheckPath: /robots.txt
    autoDeploy: true

    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production

      # Render generates this once and keeps it. Changing it signs everyone out.
      - key: SESSION_SECRET
        generateValue: true

      # Both must point at the mounted disk, or they are lost on every deploy.
      - key: DB_PATH
        value: /var/data/site.db
      - key: UPLOAD_DIR
        value: /var/data/uploads

      # This service's own public URL, e.g. https://loren-oden-portal.onrender.com
      # Password-reset links are built from it rather than the Host header, so
      # the app refuses to send a reset in production until it is set.
      - key: APP_URL
        sync: false

      # --- email, for password reset -----------------------------------
      # Any SMTP provider. Resend: smtp.resend.com / 587 / user "resend" /
      # pass = API key. Leave unset and sign-in still works; only reset stops.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # --- publishing: saving in the portal updates the live site -------
      # Fine-grained token, Contents: read and write, on the site repo only.
      # GITHUB_REPO is owner/repo of the repository the live site builds from
      # — Loren's, if the site is hosted from his account.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
